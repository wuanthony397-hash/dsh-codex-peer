name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.2.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: release ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # The suite needs one package; see .github/workflows/ci.yml for why this is
      # not a bare `npm install`.
      - name: Install the package the tests import
        run: npm install --no-save --no-audit --no-fund --ignore-scripts @deepseek-ai/schemastery@3.18.4

      - name: Run the offline test suite
        run: npm test

      - name: Take the release notes from CHANGELOG.md
        run: node .github/scripts/release-notes.mjs "${{ inputs.tag || github.ref_name }}"

      - name: Build the package
        run: npm pack

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag || github.ref_name }}" --title "${{ inputs.tag || github.ref_name }}" --notes-file release-notes.md --verify-tag ./*.tgz
